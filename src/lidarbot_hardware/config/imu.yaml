imu_driver:
  ros__parameters:
    # I2C шина Raspberry Pi обычно 1
    i2c_bus: 1

    # ICM-20948 найден по адресу 0x68 (десятичный 104)
    # Если у вас другой адрес (например, 0x69), измените здесь
    i2c_address: 104

    frame_id: "imu_link"

    # Частота публикации
    publish_rate_hz: 50.0

    # Калибровка. Для первой стадии можно оставить нули.
    # Позже можно измерить средние значения неподвижного датчика
    # и внести их сюда с обратным знаком.
    gyro_offset: [0.0, 0.0, 0.0]
    accel_offset: [0.0, 0.0, 0.0]

    gyro_scale: [1.0, 1.0, 1.0]
    accel_scale: [1.0, 1.0, 1.0]
